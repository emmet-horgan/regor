name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Full build and test (native lib + Python comparison)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ethos-u-vela tensorflow

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: test-fixtures-v1
          restore-keys: |
            test-fixtures-

      - name: Generate test model
        run: python tests/generate_model.py tests/fixtures/test_model.tflite

      - name: Download MobileNet model
        run: python tests/download_model.py tests/fixtures/mobilenet_v1_quant.tflite

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run all tests
        run: cargo test --workspace --all-features
        env:
          PYTHON: python

  # --------------------------------------------------------------------------
  # Lint (formatting only — clippy needs the native lib)
  # --------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
