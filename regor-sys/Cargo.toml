[package]
name = "regor-sys"
version = "0.1.0"
edition = "2021"
description = "Raw FFI bindings to ARM's regor compiler (Ethos-U NPU backend)"
license = "MIT OR Apache-2.0"
links = "regor"
readme = "README.md"
repository = "https://github.com/emmet-horgan/regor"
keywords = [
  "arm",
  "ethos-u",
  "vela",
  "npu",
  "bindings",
]

[build-dependencies]
# Unpacking the downloaded artifact. Fetching is left to curl or wget, which
# avoids pulling a TLS stack into build-dependencies.
flate2 = "1"
tar = "0.4"
# Verifies downloads against the digests pinned in `artifacts.sha256`.
sha2 = "0.10"
