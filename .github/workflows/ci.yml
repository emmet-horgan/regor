name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Full build and test (native lib + Python comparison)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ethos-u-vela tensorflow

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Force-clean regor-sys build state
        run: cargo clean -p regor-sys 2>nul || true
        shell: bash

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: test-fixtures-v1
          restore-keys: |
            test-fixtures-

      - name: Generate test model
        run: python tests/generate_model.py tests/fixtures/test_model.tflite

      - name: Download MobileNet model
        run: python tests/download_model.py tests/fixtures/mobilenet_v1_quant.tflite

      # CI validates the source-build path. The pre-built artifacts are
      # validated by the workflow that produces them.
      - name: Check out ethos-u-vela
        shell: bash
        run: |
          set -euo pipefail
          release=$(grep -oE 'PINNED_RELEASE: &str = "[^"]+"' regor-sys/build.rs \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          git clone --depth 1 --branch "$release" \
            https://gitlab.arm.com/artificial-intelligence/ethos-u/ethos-u-vela.git vela
          echo "ETHOS_U_VELA_PATH=$PWD/vela" >> "$GITHUB_ENV"

      # Patching is CI's job, not the build script's. Tests run against the
      # same patched source the published artifacts are built from.
      - name: Apply patches
        shell: bash
        working-directory: vela
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in ../regor-sys/patches/*.patch; do
            echo "applying $(basename "$patch")"
            git apply --verbose "$patch"
          done

      - name: Build workspace (verbose for regor-sys)
        run: cargo build --workspace --all-features -vv

      - name: Run all tests
        run: cargo test --workspace --all-features -- --test-threads=1
        env:
          PYTHON: python

  # --------------------------------------------------------------------------
  # Lint (formatting only — clippy needs the native lib)
  # --------------------------------------------------------------------------
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
