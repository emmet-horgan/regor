[package]
name = "regor"
version = "0.2.0"
edition = "2021"
description = "Safe Rust API for ARM's regor compiler (Ethos-U NPU backend)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emmet-horgan/regor"
keywords = [
  "arm",
  "ethos-u",
  "vela",
  "npu",
  "machine-learning",
]

[dependencies]
regor-sys = { path = "../regor-sys", version = "0.2.0" }
bitflags = "2"
log = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true } 

[features]
default = []
# Forward regor's diagnostics to the `log` facade.
log = ["dep:log"]
# Forward regor's diagnostics to `tracing`.
tracing = ["dep:tracing"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rstest = "0.21"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[package.metadata.docs.rs]
all-features = true
